name: Release

# Idle until a v* tag is pushed (e.g. git tag v0.2.0 && git push origin v0.2.0).
# Builds darwin + linux (arm64, amd64) with GoReleaser and attaches the archives and
# checksums.txt to a GitHub Release. install.sh picks these up automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment), same as ci.yml.
jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
