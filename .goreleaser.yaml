# GoReleaser config. Used only by .github/workflows/release.yml when a v* tag
# is pushed. Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: roost

before:
  hooks:
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    # Stamp the version from the tag. Builds without it report "dev" and
    # never auto-update.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Version-less names so .../releases/latest/download/<name> is stable;
    # install.sh depends on this.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign checksums.txt with roost's ed25519 release key (tools/sign). roost
# update refuses releases without a valid checksums.txt.sig.
signs:
  - artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"
    env:
      - ROOST_SIGNING_KEY={{ .Env.ROOST_SIGNING_KEY }}

changelog:
  sort: asc
