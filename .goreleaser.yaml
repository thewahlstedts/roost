# GoReleaser config. Used only by .github/workflows/release.yml when a v* tag
# is pushed. Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: roost

before:
  hooks:
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    # main.version is a const today, so no -X injection; bump it in main.go
    # before tagging.
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    # Version-less names so .../releases/latest/download/<name> is stable;
    # install.sh depends on this.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
